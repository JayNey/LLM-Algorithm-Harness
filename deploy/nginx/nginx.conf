# LLM-Algorithm-Harness API 反向代理配置（issue #159）。
# 由 docker-compose.prod.yml 以只读方式挂载到 /etc/nginx/nginx.conf。
#
# - gzip 压缩 JSON/API 响应
# - /api/v1/auth/* 与 /api/v1/ws 之外的 API 路径按来源 IP 限流
# - /api/v1/ws/progress WebSocket 升级代理
# - client_max_body_size 与 FILE_UPLOAD_MAX_BYTES（默认 100 MiB）对齐
# - 文件末尾附 HTTPS 启用注释模板

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;

    # 敏感头不透传给日志之外的下游
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_vary on;

    # 限流分区：登录/注册等认证端点与应用整体分开计数，
    # 数值与 AuthSettings（AUTH_RATE_LIMIT/AUTH_PROTECTED_RATE_LIMIT，每分钟）对齐
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;

    upstream harness_api {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;

        # 与 FileSettings.FILE_UPLOAD_MAX_BYTES（默认 100 MiB）对齐
        client_max_body_size 100m;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;

        # 认证端点：更严格的限流（登录爆破/注册滥用）
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://harness_api;
        }

        # WebSocket 进度推送（/api/v1/ws/progress）：升级连接并延长读超时
        location /api/v1/ws {
            proxy_pass http://harness_api;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 其余 API 路径
        location / {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://harness_api;
        }
    }

    # ------------------------------------------------------------------
    # HTTPS 启用模板（Let's Encrypt 证书示例）：
    #
    # 1. 签发证书（宿主机，certbot standalone 或 DNS 验证）：
    #      certbot certonly --standalone -d harness.example.com
    # 2. 证书放到 ./deploy/nginx/certs/ 并在 docker-compose.prod.yml
    #    放开 443 端口与 certs 卷挂载。
    # 3. 取消下方 server 块注释，并在 80 端口 server 中加一条跳转：
    #      return 301 https://$host$request_uri;
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name harness.example.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #
    #     client_max_body_size 100m;
    #
    #     location / {
    #         proxy_pass http://harness_api;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto https;
    #     }
    # }
    # ------------------------------------------------------------------
}
